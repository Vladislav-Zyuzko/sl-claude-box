services:
  claude-worker:
    build:
      context: ./claude-worker-ssh
      dockerfile: Dockerfile
      args:
        # версия Claude Code в образе; обновление — см. README
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CLAUDE_REFRESH: ${CLAUDE_REFRESH:-0}
    container_name: claude-worker
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # обновляемся пересборкой образа: внутри контейнера автоапдейтер всё равно
      # не может писать в /usr/local (claude стоит от root, задачи идут под claude-ssh)
      - DISABLE_AUTOUPDATER=1
      # git/github auth + откуда и какую ветку тянуть
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SWEET_LIMIT_REPO=${SWEET_LIMIT_REPO:-https://github.com/Tsezia/sweet_limit.git}
      - BASE_BRANCH=${BASE_BRANCH:-develop}
      - GIT_USER_NAME=${GIT_USER_NAME:-SLNexus Bot}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-slnexus-bot@users.noreply.github.com}
    volumes:
      - ./workspace:/workspace
      - ./ssh-key.pub:/home/claude-ssh/.ssh/authorized_keys:ro
      - toolchain:/opt/toolchain          # Android SDK + Flutter + кэши (persistent)
      - claude-home:/home/claude-ssh/.claude   # транскрипты сессий Claude (для /restore)
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./tg-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - SSH_HOST=claude-worker
      - SSH_PORT=22
      - SSH_USER=claude-ssh
      - SSH_KEY_PATH=/ssh-key
      # модель Nexus и субагентов: стартовая + список для меню /model
      - NEXUS_MODEL=${NEXUS_MODEL:-claude-opus-5}
      - NEXUS_MODELS=${NEXUS_MODELS:-}
      - NEXUS_SUBAGENT_MODEL_FORCE=${NEXUS_SUBAGENT_MODEL_FORCE:-}
      # где в воркере лежит оффлайн-слепок Figma (заливается figma-snapshot.sh)
      - NEXUS_FIGMA_DIR=${NEXUS_FIGMA_DIR:-/workspace/figma}
      # дайджест: адрес служебного маршрута и токен для команды /digest
      - NEXUS_DIGEST_URL=${NEXUS_DIGEST_URL:-http://nexus-digest:8080}
      - NEXUS_DIGEST_MCP_TOKEN=${NEXUS_DIGEST_MCP_TOKEN:-}
    volumes:
      - ./tg-bot:/app
      - ./ssh-key:/ssh-key
    working_dir: /app
    command: python bot.py
    depends_on:
      - claude-worker
    restart: unless-stopped

  # Дайджест активных задач: собственное расписание, хранение и MCP-инструменты.
  # Данные трекера берёт только через sl-tracker-mcp (чужой сервис, не правим).
  nexus-digest:
    build:
      context: ./digest-mcp
      dockerfile: Dockerfile
    container_name: nexus-digest
    environment:
      # тот же токен и тот же список адресатов, что у бота — один источник
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      # источник данных — MCP трекера
      - SL_TRACKER_MCP_URL=${SL_TRACKER_MCP_URL}
      - SL_TRACKER_MCP_TOKEN=${SL_TRACKER_MCP_TOKEN:-}
      # переопределение имён инструментов sl-tracker-mcp (JSON), если они иные
      - SL_TRACKER_TOOLS=${SL_TRACKER_TOOLS:-}
      - SL_TRACKER_PROJECT=${SL_TRACKER_PROJECT:-sweet-limit}
      # пусто = все очереди проекта
      - NEXUS_DIGEST_QUEUES=${NEXUS_DIGEST_QUEUES:-}
      - NEXUS_DIGEST_STATUSES=${NEXUS_DIGEST_STATUSES:-in_progress,review,testing}
      - NEXUS_DIGEST_TIMES=${NEXUS_DIGEST_TIMES:-08:00,20:00}
      - NEXUS_DIGEST_TZ=${NEXUS_DIGEST_TZ:-Asia/Omsk}
      - NEXUS_DIGEST_LATE_LIMIT_MIN=${NEXUS_DIGEST_LATE_LIMIT_MIN:-60}
      - NEXUS_DIGEST_MAX_TASKS=${NEXUS_DIGEST_MAX_TASKS:-30}
      - NEXUS_DIGEST_KEEP_DAYS=${NEXUS_DIGEST_KEEP_DAYS:-90}
      - NEXUS_DIGEST_MCP_TOKEN=${NEXUS_DIGEST_MCP_TOKEN:-}
    volumes:
      - digest-data:/data       # state.json + snapshots.jsonl, переживают пересборку
    # порт наружу НЕ публикуем: MCP доступен только внутри compose-сети
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  toolchain:
  claude-home:
  digest-data:
