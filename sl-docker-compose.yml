services:
  claude-worker:
    build:
      context: ./claude-worker-ssh
      dockerfile: Dockerfile
      args:
        # версия Claude Code в образе; обновление — см. README
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CLAUDE_REFRESH: ${CLAUDE_REFRESH:-0}
    container_name: claude-worker
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # обновляемся пересборкой образа: внутри контейнера автоапдейтер всё равно
      # не может писать в /usr/local (claude стоит от root, задачи идут под claude-ssh)
      - DISABLE_AUTOUPDATER=1
      # git/github auth + откуда и какую ветку тянуть
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SWEET_LIMIT_REPO=${SWEET_LIMIT_REPO:-https://github.com/Tsezia/sweet_limit.git}
      - BASE_BRANCH=${BASE_BRANCH:-develop}
      - GIT_USER_NAME=${GIT_USER_NAME:-SLNexus Bot}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-slnexus-bot@users.noreply.github.com}
    volumes:
      - ./workspace:/workspace
      - ./ssh-key.pub:/home/claude-ssh/.ssh/authorized_keys:ro
      - toolchain:/opt/toolchain          # Android SDK + Flutter + кэши (persistent)
      - claude-home:/home/claude-ssh/.claude   # транскрипты сессий Claude (для /restore)
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./tg-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - SSH_HOST=claude-worker
      - SSH_PORT=22
      - SSH_USER=claude-ssh
      - SSH_KEY_PATH=/ssh-key
      # модель Nexus и субагентов: стартовая + список для меню /model
      - NEXUS_MODEL=${NEXUS_MODEL:-claude-opus-5}
      - NEXUS_MODELS=${NEXUS_MODELS:-}
      - NEXUS_SUBAGENT_MODEL_FORCE=${NEXUS_SUBAGENT_MODEL_FORCE:-}
    volumes:
      - ./tg-bot:/app
      - ./ssh-key:/ssh-key
    working_dir: /app
    command: python bot.py
    depends_on:
      - claude-worker
    restart: unless-stopped

volumes:
  toolchain:
  claude-home:
