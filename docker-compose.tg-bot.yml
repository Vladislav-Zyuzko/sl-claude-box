services:
  claude-worker:
    build:
      context: ./claude-worker-ssh
      dockerfile: Dockerfile
    container_name: claude-worker
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
    volumes:
      - ./workspace:/workspace
      - ./ssh-key.pub:/home/claude-ssh/.ssh/authorized_keys:ro
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./tg-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - SSH_HOST=claude-worker
      - SSH_PORT=22
      - SSH_USER=claude-ssh
      - SSH_KEY_PATH=/ssh-key
    volumes:
      - ./tg-bot:/app
      - ./ssh-key:/ssh-key
    working_dir: /app
    command: python bot.py
    depends_on:
      - claude-worker
    restart: unless-stopped
